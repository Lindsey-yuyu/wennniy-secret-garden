<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵敏鱼の妮妮家汇总</title>
<style>
:root{
  --bg:#FBF7F4; --bg2:#F4ECE7; --card:#FFFFFF; --line:#EDE2DB;
  --ink:#3D3230; --ink2:#7A6A65; --ink3:#A89A94;
  --pink:#E88BA6; --pink-l:#FBE7ED; --gold:#D9A54C; --teal:#4FB3B8; --violet:#A88CD9;
  --shadow:0 1px 2px rgba(90,60,50,.05),0 6px 20px rgba(90,60,50,.06);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}

/* ---------- header ---------- */
header{padding:38px 0 26px;text-align:center}
header .kicker{font-size:12px;letter-spacing:.32em;color:var(--ink3);text-transform:uppercase;margin-bottom:10px}
header h1{margin:0;font-size:31px;font-weight:700;letter-spacing:.02em}
header h1 em{font-style:normal;color:var(--pink)}          /* 灵敏鱼：粉色点缀 */
header h1 .rest{font-weight:500;color:var(--ink2)}          /* の / 汇总：弱一档 */
                                                            /* 妮妮家：跟随 h1 本色 + 700 字重（主重点） */
header .sub{margin-top:8px;color:var(--ink2);font-size:13px}
.hdr-dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.hdr-dots i{width:7px;height:7px;border-radius:50%;display:block}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px;
  background:var(--card);padding:6px;border-radius:999px;box-shadow:var(--shadow);width:fit-content;margin-left:auto;margin-right:auto}
.tabs button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;
  padding:9px 20px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--bg2)}
.tabs button.on{background:var(--pink);color:#fff;box-shadow:0 3px 10px rgba(232,139,166,.35)}
.panel{display:none;animation:fade .3s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .lb{font-size:12px;color:var(--ink3);letter-spacing:.04em}
.kpi .vl{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:2px}
.kpi .ft{font-size:11.5px;color:var(--ink3);margin-top:3px}

/* ---------- card / chart ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px}
.card h3{margin:0 0 3px;font-size:16px;font-weight:650}
.card .desc{color:var(--ink3);font-size:12.5px;margin-bottom:16px}
.card.full{grid-column:1/-1}
svg{display:block;width:100%;height:auto;overflow:visible}
text{font-family:inherit}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:600;color:var(--ink3);font-size:11.5px;letter-spacing:.05em;
  padding:0 12px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.pl,td.pl{text-align:left}
th:hover{color:var(--pink)}
th.sorted::after{content:" ▾";color:var(--pink)}
th.sorted.asc::after{content:" ▴"}
td{padding:9px 12px;border-bottom:1px solid #F6F0EC;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#FDF8F6}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--bg2);color:var(--ink2)}
.tag.warn{background:#FDF0E7;color:#C07A3A}
.tag.pink{background:var(--pink-l);color:#C4657F}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}

/* ---------- series chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;
  font:inherit;font-size:13px;cursor:pointer;color:var(--ink2);transition:.18s;display:flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--pink);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.chip .cdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---------- 明细总表：系列摘要 ---------- */
.ser-sum{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 22px;margin-bottom:20px;box-shadow:var(--shadow);font-size:13px;color:var(--ink2)}
.ser-sum b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.ser-sum .tot{font-size:20px;font-weight:700}
.search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.search-row input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;font:inherit;font-size:13px;background:var(--card);color:var(--ink);outline:none;transition:.18s}
.search-row input:focus{border-color:var(--pink)}
.search-row .cnt{font-size:12.5px;color:var(--ink3)}

/* sp 版本分隔标题 */
.sp-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;padding-left:12px;
  border-left:4px solid var(--pink);font-size:15px;font-weight:650}
.sp-h small{font-weight:400;color:var(--ink3);font-size:12.5px}

/* ---------- 车卡片 ---------- */
.cars{display:grid;grid-template-columns:1fr;gap:16px}
.car{display:flex;gap:20px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:.18s}
.car:hover{box-shadow:0 4px 8px rgba(90,60,50,.06),0 14px 34px rgba(90,60,50,.10)}
.car-imgs{flex:0 0 200px;display:flex;flex-direction:column;gap:8px;min-width:0}
.car-imgs .main{width:100%;border-radius:12px;overflow:hidden;background:var(--bg2);
  border:1px solid var(--line);cursor:zoom-in;display:flex;align-items:center;justify-content:center}
/* 同一车内多张宣图：外框完全等大，图片等比缩放不裁切 */
.car-imgs.single .main{height:200px}
.car-imgs.duo .main{height:152px}
.car-imgs .main img{width:100%;height:100%;object-fit:contain;display:block;transition:.25s}
.car-imgs .main:hover img{transform:scale(1.05)}
.car-imgs .noimg{width:100%;height:200px;border-radius:12px;background:var(--bg2);border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px}
.car-imgs .strip{display:flex;gap:6px;flex-wrap:wrap}
.car-imgs .strip img{width:44px;height:44px;border-radius:8px;object-fit:contain;cursor:zoom-in;
  border:1px solid var(--line);background:var(--bg2)}
.car-main{flex:1;min-width:0;display:flex;flex-direction:column}
.car-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.car-head h4{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.01em}
.car-head .spacer{flex:1}
.car-head .price{font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.car-tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.car-tbl th{font-size:11px;color:var(--ink3);font-weight:600;padding:0 10px 6px;text-align:right;
  border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
.car-tbl th.c-content{text-align:left}
.car-tbl td{padding:6.5px 10px;border-bottom:1px solid #F6F0EC;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.car-tbl tr:last-child td{border-bottom:0}
.car-tbl td.c-content{text-align:left;white-space:normal}
.car-tbl td b{font-weight:650}
.car-note{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.car-note:empty{display:none}
.empty-tip{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:34px;text-align:center;color:var(--ink3)}

/* ---------- 蔷薇等：分组框 ---------- */
.sec-box{border:1.5px solid var(--line);border-radius:var(--r);padding:16px 16px 2px;margin-bottom:16px;
  background:linear-gradient(180deg,#FDF9F7,#FBF7F4)}
.sec-box > .cars{gap:14px}
.sec-t{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-left:12px;
  border-left:4px solid var(--violet);font-size:15px;font-weight:650}
.sec-t small{font-weight:400;color:var(--ink3);font-size:12.5px}

/* 窄屏补充信息（桌面隐藏）：系列名下方的最贵/最省小字 */
.m-ex{display:none}
/* 图表容器：窄屏下在卡片内横向滚动，保证 SVG 文字不被等比缩到不可读 */
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chart-scroll::-webkit-scrollbar{height:6px}
.chart-scroll::-webkit-scrollbar-thumb{background:#E3D6CE;border-radius:3px}
/* ---------- 表格列宽（避免手机左右滑动） ---------- */
.tbl-wrap table{table-layout:fixed}
.tbl-wrap col.c-g,.tbl-wrap th.c-g{width:17%}          /* 衣橱 */
.tbl-wrap col.c-n,.tbl-wrap th.c-n{width:24%}          /* 内容 */
.tbl-wrap col.c-qty,.tbl-wrap th.c-qty{width:8%}       /* 数量 */
.tbl-wrap col.c-num,.tbl-wrap th.c-num{width:17%}      /* 金额列 */
.tbl-wrap col.c-set,.tbl-wrap th.c-set{width:15%}      /* 单套价 */
.tbl-wrap col.c-sr,.tbl-wrap th.c-sr{width:20%}        /* 系列名 */
.tbl-wrap col.c-cnt,.tbl-wrap th.c-cnt{width:10%}      /* 车数/枚数 */
/* 7 列总表（系列对比）另算比例 */
.tbl-wrap table.t7 col.c-sr,.tbl-wrap table.t7 th.c-sr{width:20%}
.tbl-wrap table.t7 col.c-cnt,.tbl-wrap table.t7 th.c-cnt{width:10%}
.tbl-wrap table.t7 col.c-num,.tbl-wrap table.t7 th.c-num{width:15%}
.tbl-wrap td.c-num,.tbl-wrap th.c-num{white-space:nowrap}
/* 车详情卡片：table-layout:fixed + colgroup 固定列宽，保证所有车、所有系列的
   【数量】【均摊】【大货】【单件】列完全同宽、上下对齐。
   注意：选择器必须写成 .car-tbl{...}（table 自身的类），写成 .car-tbl table{...} 无效。 */
.car-tbl{table-layout:fixed}
.car-tbl col.c-content{width:auto}      /* 唯一的可伸缩列，吃掉剩余空间 */
.car-tbl col.c-qty{width:62px}
.car-tbl col.c-num{width:78px}
.car-tbl col.c-set{width:94px}
.car-tbl th.c-qty{text-align:center}
/* 属性小标：放在内容列内联成一行、右对齐强制对齐，不再占独立列 */
.car-tbl .c-catline{display:block;text-align:right;margin-top:3px;line-height:1}
.cat-tag{display:inline-block;padding:0 6px;border-radius:999px;font-size:10px;line-height:16px;
  background:var(--bg2);color:var(--ink2);white-space:nowrap;vertical-align:middle;font-weight:500}
.cat-tag.x{background:#FBE7EF;color:#C0507A}
.car-tbl td.c-qty{text-align:center;font-variant-numeric:tabular-nums}
.car-tbl td.c-num{font-variant-numeric:tabular-nums}
.car-tbl td.c-set{white-space:nowrap}
.car-tbl th,.car-tbl td{overflow:hidden;text-overflow:ellipsis}
.car-tbl td.c-content{white-space:normal;overflow:visible}   /* 内容列允许换行 */
/* 桌面端：内容列强制左对齐（手机端在下方 max-width:760px 里改居中） */
@media(min-width:761px){
  .car-tbl th.c-content,.car-tbl td.c-content{text-align:left !important}
}

.ov-cats{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 10px}
.ov-cats .chip{padding:5px 13px;font-size:12.5px}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:6px}
.gal figure{margin:0;position:relative;overflow:hidden;border-radius:12px;background:var(--bg2);
  aspect-ratio:1;border:1px solid var(--line);cursor:zoom-in;transition:.2s}
.gal figure:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(90,60,50,.15);z-index:2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(50,35,30,.72));
  color:#fff;font-size:11px;padding:14px 8px 5px;opacity:0;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal figure:hover figcaption{opacity:1}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(45,32,28,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:90vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#lb .lb-cap{position:fixed;bottom:26px;left:0;right:0;text-align:center;color:#F3E9E4;font-size:13px;letter-spacing:.05em}

/* ---------- 云端链接条 ---------- */
.cloud{display:flex;flex-wrap:wrap;gap:5px 16px;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 22px;margin:-12px auto 26px;box-shadow:var(--shadow);width:fit-content;max-width:100%;
  font-size:12.5px;color:var(--ink2)}
.cloud .lb{color:var(--ink3)}
.cloud a{color:#D0688C;text-decoration:none;font-weight:600;word-break:break-all}
.cloud a:hover{text-decoration:underline}

/* ---------- 我在妮妮家吃了多少 ---------- */
.mine-bar{position:sticky;top:8px;z-index:6;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 22px;margin-bottom:16px;
  box-shadow:0 4px 16px rgba(90,60,50,.10);font-size:13px;color:var(--ink2)}
.mine-bar b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.mine-bar .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font:inherit;
  font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--pink);color:var(--ink)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600;padding:9px 26px;font-size:13.5px}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.done{background:var(--bg2);border-color:var(--line);color:var(--ink3)}
.mine-acts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.mask{color:#DCCFC8;letter-spacing:.08em}
.tbl-wrap table.tm col.c-ck,.tbl-wrap table.tm th.c-ck{width:6%}        /* 复选 */
.tbl-wrap table.tm col.c-g,.tbl-wrap table.tm th.c-g{width:16%}         /* 衣橱 */
.tbl-wrap table.tm col.c-n,.tbl-wrap table.tm th.c-n{width:21%}         /* 内容 */
.tbl-wrap table.tm col.c-qty,.tbl-wrap table.tm th.c-qty{width:8%}      /* 数量 */
.tbl-wrap table.tm col.c-num,.tbl-wrap table.tm th.c-num{width:15.33%}  /* 金额（均摊/大货/单件） */
.tbl-wrap table.tm td.c-ck{text-align:center}
.tbl-wrap table.tm td.c-qty{text-align:center}
.tbl-wrap table.tm td.c-num{font-variant-numeric:tabular-nums;padding-right:14px}
/* 数量滚轮：0–10，上下滑动 / 滚轮 / 拖拽 / 方向键都能改。
   容器高 42（内容区 40）、每项 22、首尾留白 9 —— 上下各露出 9px 相邻数字，
   一眼能看出可以滚。吸附公式 scrollTop = 值 × 22 与容器高度无关，所以改高度不会破坏换算。 */
.qw{width:44px;height:42px;margin:0 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
  scroll-snap-type:y mandatory;overscroll-behavior:contain;touch-action:pan-y;
  border:1px solid var(--line);border-radius:9px;background:var(--bg2);outline:none;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.qw::-webkit-scrollbar{display:none}
.qw-p{height:9px}                                  /* = (内容区 40 - 项高 22) / 2，保证 0 和 10 能居中 */
.qw-i{height:22px;line-height:22px;text-align:center;font-size:12.5px;color:var(--ink3);
  scroll-snap-align:center;font-variant-numeric:tabular-nums}
.qw-i.sel{color:var(--ink);font-weight:600;font-size:13.5px}
.qw:focus{border-color:var(--pink);background:var(--card)}
.qw.off{opacity:.32;pointer-events:none}
/* 手机端数量用原生 select（滚轮 390 个 ≈ 5000 节点是手机卡顿主因之一） */
.qsel{width:46px;height:30px;margin:0 auto;display:block;border:1px solid #EADFDB;border-radius:8px;
  background:var(--card);font:inherit;font-size:13px;color:var(--ink);text-align:center;
  padding:0 2px;appearance:none;-webkit-appearance:none}
.qsel:focus{border-color:var(--pink);outline:none}
.qsel:disabled{opacity:.32}
tr.on{background:#FDF2F5}
tr.on td{border-bottom-color:#F7E4EA}
.mine-res{margin-top:14px}
.mine-sum{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;background:var(--bg2);
  border-radius:12px;padding:12px 18px;font-size:13px;color:var(--ink2)}
.mine-sum b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.mine-sum .big{font-size:22px;font-weight:700;color:var(--ink);margin-left:auto}
.mine-total{background:var(--card);border:1.5px solid var(--pink);border-radius:var(--r);
  padding:18px 22px;margin-top:6px;box-shadow:var(--shadow)}
.mine-total h3{margin:0 0 4px;font-size:16px;font-weight:650}
.mine-total .rows{margin-top:12px;font-size:12.5px;color:var(--ink2)}
.mine-total .rows div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #F6F0EC}
.mine-total .rows div:last-child{border-bottom:0}
.mine-total .rows div span:nth-child(3){margin-left:auto;color:var(--ink3)}
.mine-total .rows div span:last-child{margin-left:18px;min-width:84px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.mine-total .grand{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)}
.mine-total .grand .n{font-size:13px;color:var(--ink2)}
.mine-total .grand .v{margin-left:auto;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
/* 系列索引（一键跳到对应系列，随顶栏一起吸顶） */
.mine-index{flex:1 1 100%;display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);scrollbar-width:none}
.mine-index::-webkit-scrollbar{display:none}
.mi-chip{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.mi-chip:hover{border-color:var(--pink);color:var(--ink)}
.mi-chip .dot{width:8px;height:8px;border-radius:50%}
/* 详细列表：已勾选章子汇总大表 */

  let imgsHtml;
  if (!imgs.length) imgsHtml = `<div class="noimg">无宣图</div>`;
  else if (imgs.length <= 2) imgsHtml = imgs.map(shot).join('');
  else imgsHtml = shot(imgs[0]) +

  // ---- 单套价列（人鱼浮雕小物 / 小樱权杖）----

      // 同一套（人鱼：每个设计一套；小樱：同名钥匙版+权杖版一套）合并为一个单元格
      if (run && key!==null && key===run.key){ run.rows++; setCells.push(null); }
      else if (key!==null){ run = {key, val:it.setPrice, rows:1}; setCells.push(run); }
      else { run = null; setCells.push({val:null, rows:1}); }

  }

    const w = rowWarn(it) ? '<span class="tag warn" title="均摊+大货≠单件，以单件为准">⚠</span> ' : '';
    const td = isTeDian(it) ? '<span class="tag pink">特典</span> ' : '';
    /* 属性（衣橱 / 小物）：宽屏走独立列；≤400px 极窄屏列宽归零，改由这里的内联小标呈现 */
    const cat = it.cat || '衣橱';
    const catTag = `<span class="cat-tag${cat==='小物'?' x':''}">${esc(cat)}</span>`;
    let setTd = '';
    if (hasSet){
      const cell = setCells[i];
      if (cell && cell.val!=null)
        setTd = `<td class="c-set c-num"${cell.rows>1?` rowspan="${cell.rows}"`:''}><b>${money2(cell.val)}</b></td>`;
      else if (cell && cell.val===null)
        setTd = `<td class="c-set c-num"></td>`;
    }
    return `<tr>
      <td class="c-content">${td}${esc(it.content)}<span class="c-catline">${catTag}</span></td>

      <td class="c-num">${esc(it.share)}</td>

      <td class="c-num"><b>${esc(it.unit)}</b>${w}</td>

  }).join('');
  const notes = [];
  if (g.note) notes.push(`<span class="tag">📝 ${esc(g.note)}</span>`);
  if (g.items.some(rowWarn)) notes.push('<span class="tag warn">⚠ 部分行 均摊+大货≠单件，以单件为准</span>');
  if (!imgs.length) notes.push('<span class="tag">该车暂无宣图</span>');
  if (hasSet) notes.push(`<span class="tag pink">${esc(g.setPriceLabel)}${g.name==='浮雕小物'?' = 单件 × 9':' = 钥匙版 + 权杖版'}</span>`);
  return `<article class="car">
    <div class="car-imgs ${imgsCls}">${imgsHtml}</div>
    <div class="car-main">
      <div class="car-head">
        <h4>${esc(g.name)}</h4>
        ${g.form?`<span class="tag">${esc(g.form)}</span>`:''}
        <span class="tag">${g.badgeCount} 枚</span>
        <span class="spacer"></span>
        <span class="price">${money2(g.total)}</span>
      </div>
      <table class="car-tbl">
        <colgroup>
          <col class="c-content"><col class="c-qty">
          <col class="c-num"><col class="c-num"><col class="c-num">
          ${hasSet?'<col class="c-set">':''}
        </colgroup>
        <thead><tr><th class="c-content">内容</th><th class="c-qty">数量</th><th class="c-num">均摊</th><th class="c-num">大货</th><th class="c-num">单件</th>${hasSet?`<th class="c-set">${esc(g.setPriceLabel)}</th>`:''}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="car-note">${notes.join('')}</div>
    </div>
  </article>`;
}

function renderDetail(){
  const s = SERIES[det.idx];
  const badges = s.groups.reduce((a,g)=>a+g.badgeCount,0);
  $('#detSum').innerHTML =
    `<span><b>${s.groups.length}</b> 车</span>
     <span><b>${badges}</b> 枚</span>
     <span>系列投入 <b class="tot">${money2(s.total)}</b></span>
     <span>均单价 <b>${money2(s.total/badges)}</b></span>
     <span>宣图 <b>${s.groups.reduce((a,g)=>a+(g.thumbs||[]).length,0)}</b> 张</span>`;
  renderDetChips();

  const kw = det.kw.trim().toLowerCase();
  const list = s.groups.filter(g => !kw ||
    g.name.toLowerCase().includes(kw) ||
    g.items.some(it => it.content.toLowerCase().includes(kw)));

  // 按 section 分段（蔷薇：经典版 / 大正），无 section 的系列整体不加框
  let html = '', lastSp = null, buf = [], sec = undefined, secSum = 0, secCnt = 0, secBadges = 0;
  const flush = ()=>{
    if (!buf.length) return;
    const inner = `<div class="cars">${buf.join('')}</div>`;
    html += sec
      ? `<div class="sec-box"><div class="sec-t">${esc(sec)}<small>${secCnt} 车 · ${money2(secSum)} · ${secBadges} 枚</small></div>${inner}</div>`
      : inner;
    buf = []; secSum = 0; secCnt = 0; secBadges = 0;
  };
  list.forEach(g=>{
    const gs = g.section || null;
    if (gs !== sec){ flush(); sec = gs; }
    if (s.spTotals && g.sp && g.sp !== lastSp){
      const spGroups = s.groups.filter(x=>x.sp===g.sp);
      const spSum = spGroups.reduce((a,x)=>a+x.total,0);
      buf.push(`<div class="sp-h">${esc(g.sp)}<small>${spGroups.length} 车 · ${money2(spSum)}</small></div>`);
      lastSp = g.sp;
    }
    buf.push(carCard(g, s.color));
    secSum += g.total; secCnt++; secBadges += g.badgeCount;
  });
  flush();
  const shown = list.length;
  $('#detCnt').textContent = `显示 ${shown} / ${s.groups.length} 车`;
  $('#detBody').innerHTML = shown ? html
    : `<div class="empty-tip">没有匹配「${esc(det.kw)}」的衣橱</div>`;
}
$('#detSearch').addEventListener('input', e=>{ det.kw = e.target.value; renderDetail(); });

const ser = { idx:0 };

function hbarSVG(rows, opts){
  // rows: [{label, value, color}]
  const W = 680, rowH = opts.rowH||30, padT = 8;
  const maxLen = Math.max(...rows.map(r=>r.label.length));
  const padL = Math.min(250, Math.max(70, maxLen*13.2 + 18));
  const padR = 74;
  const H = padT + rows.length*rowH + 4;
  const max = Math.max(...rows.map(r=>r.value)) || 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  rows.forEach((r,i)=>{
    const y = padT + i*rowH;
    const bw = (W-padL-padR) * r.value / max;
    s += `<text x="${padL-10}" y="${y+rowH/2+4.5}" text-anchor="end" font-size="12.8" fill="#3D3230">${esc(r.label)}</text>`;
    s += `<rect x="${padL}" y="${y+6}" width="${Math.max(2.5,bw)}" height="${rowH-12}" rx="4.5" fill="${r.color}" opacity=".92"/>`;
    s += `<text x="${padL+Math.max(2.5,bw)+8}" y="${y+rowH/2+4.5}" font-size="12" fill="#7A6A65">${money(r.value)}</text>`;
  });
  return `<div class="chart-scroll">` + s + '</svg></div>';
}

function renderSerChips(){

      <span class="cdot" style="background:${s.color}"></span>${esc(s.name)}<b>${s.groups.length}</b></button>`).join('');

/* 逐枚单价柱状图：每枚章子一根柱（高=单件价），按车分组，组上方标该车总投入。
   「9个/套」的浮雕小物按每行设计 9 根细柱展示。 */
function unitBarsCard(s){
  const groups = s.groups.map(g=>{
    const rows = [];
    g.items.forEach(it=>{
      const n = Math.max(1, Math.round(it.qtyN||1));
      rows.push({
        label: `${g.name}-${it.content}` + (n>1 ? ` ×${n}` : ''),
        v: +(it.unitN||0), n
      });
    });
    return { name:g.name, total:g.total, rows };
  });

  const maxV = Math.max(1, ...groups.flatMap(g=>g.rows.map(r=>r.v)));
  const top = Math.ceil(maxV/10)*10 || 10;           // y 轴上限取整
  const VBW=1100, padL=44, padR=10, CH=190, padT=26; // padT 上方留给总价标注
  const barW=15, thinW=5, gap=3, thinSp=1, groupPad=9, groupGap=18, minGW=56;
  const maxLen = Math.max(8, ...groups.flatMap(g=>g.rows.map(r=>r.label.length)));
  const labH = Math.min(118, Math.max(52, maxLen*6.9));
  const rowH = padT + CH + 12 + labH;

  // 每组宽度
  groups.forEach(g=>{
    const w = g.rows.reduce((a,r)=>{
      const bw = r.n>1 ? r.n*thinW+(r.n-1)*thinSp : barW;
      return a + bw + gap;
    }, 0) - gap;
    g.w = Math.max(minGW, w + groupPad*2);
  });

  // 分块：一行放不下的车折到下一块
  const chunks = []; let cur=[], curW=0;
  groups.forEach(g=>{
    const gw = g.w + (cur.length ? groupGap : 0);
    if (cur.length && curW+gw > VBW-padL-padR){ chunks.push(cur); cur=[g]; curW=g.w; }
    else { cur.push(g); curW+=gw; }
  });
  if (cur.length) chunks.push(cur);

  const svg = chunks.map(ck=>{
    let x = padL, out = `<svg viewBox="0 0 ${VBW} ${rowH}">`;
    for(let i=0;i<=4;i++){
      const yy = padT + CH - CH*i/4;
      out += `<line x1="${padL}" y1="${yy}" x2="${VBW-padR}" y2="${yy}" stroke="${i===0?'#EDE2DB':'#F6F0EC'}"/>` +
             `<text x="${padL-7}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="#A89A94">${Math.round(top*i/4)}</text>`;
    }
    ck.forEach((g,gi)=>{
      out += `<rect x="${x}" y="${padT}" width="${g.w}" height="${CH}" fill="${gi%2?'#F8F1EC':'none'}" rx="6"/>`;
      out += `<text x="${x+g.w/2}" y="${padT-9}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3D3230">${money2(g.total)}</text>`;
      let bx = x + groupPad;
      g.rows.forEach(r=>{
        const rowStart = bx;
        const bw = r.n>1 ? thinW : barW;
        const sp = r.n>1 ? thinSp : gap;
        const totalW = r.n*bw + (r.n-1)*sp;
        for(let i=0;i<r.n;i++){
          const h = Math.max(1.2, CH*r.v/top);
          out += `<rect x="${bx.toFixed(1)}" y="${(padT+CH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="${r.n>1?1.5:2.5}" fill="${r.v>0?s.color:'#CBBFB8'}" opacity="${r.n>1?'.8':'.92'}"><title>【${esc(r.label)}】 单件 ${money2(r.v)}</title></rect>`;
          bx += bw + sp;
        }
        const cx = rowStart + totalW/2;
        out += `<text x="${cx.toFixed(1)}" y="${padT+CH+11}" text-anchor="end" font-size="10.5" fill="#7A6A65" transform="rotate(-40 ${cx.toFixed(1)} ${padT+CH+11})">${esc(r.label)}</text>`;
      });
      x += g.w + groupGap;
    });
    return out + '</svg>';
  }).join('');

  return `<div class="card m-hide"><h3>各车逐枚单价</h3>
    <div class="desc">每枚章子一根柱，高度 = 单件价；标签为【衣橱-内容】，组上方为该车总投入，按原表顺序排列（细柱为「9个/套」的浮雕小物，悬停看单价）</div>
    <div class="chart-scroll chart-wide">${svg}</div></div>`;
}

/* 大货金额趋势：每枚章子一个点（纵轴=该章子的大货金额，不用整车合计），
   按表格车序排列（越靠前开得越早）；细线连原始点，粗线为 5 枚移动平均；
   浅色带为同一车；剔除小物（浮雕小物）与特典行。 */
function bulkTrendCard(s){
  const pts = [], bands = [];
  s.groups.forEach(g=>{
    const from = pts.length;
    g.items.forEach(it=>{
      if (it.cat === '小物' || it.isBonus) return;
      const b = NUM(it.bulk);
      if (b === null) return;
      pts.push({ v:b, g:g.name, n:it.content });
    });
    if (pts.length > from) bands.push({ name:g.name, a:from, b:pts.length-1 });
  });
  const excluded = s.groups.reduce((a,g)=>a+g.items.filter(it=>it.cat==='小物'||it.isBonus).length, 0);
  if (!pts.length) return '';

  const W=1100, padL=48, padR=18, padT=20, CH=200, padB=78, H=padT+CH+padB;
  const maxV = Math.max(...pts.map(p=>p.v));
  const top = Math.ceil(maxV/10)*10 || 10;
  const span = W-padL-padR;
  const step = span/Math.max(1, pts.length-1);
  const X = i => padL + step*i;
  const Y = v => padT + CH - CH*v/top;
  const cl = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  // 车分带（交替底色，一眼看出哪几个点是一车）
  bands.forEach((bd,k)=>{
    if (k%2) return;
    const x1 = cl(X(bd.a)-step/2, padL, W-padR), x2 = cl(X(bd.b)+step/2, padL, W-padR);
    out += `<rect x="${x1.toFixed(1)}" y="${padT}" width="${Math.max(1,x2-x1).toFixed(1)}" height="${CH}" fill="#F8F1EC" rx="5"/>`;
  });
  // y 轴
  for(let i=0;i<=4;i++){
    const yy = padT+CH-CH*i/4;
    out += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="${i===0?'#EDE2DB':'#F6F0EC'}"/>` +
           `<text x="${padL-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="#A89A94">${Math.round(top*i/4)}</text>`;
  }
  // 车名（带中心，-45°）
  bands.forEach(bd=>{
    const cx = (X(bd.a)+X(bd.b))/2;
    out += `<text x="${cx.toFixed(1)}" y="${padT+CH+13}" text-anchor="end" font-size="10.5" fill="#7A6A65" transform="rotate(-45 ${cx.toFixed(1)} ${padT+CH+13})">${esc(bd.name)}</text>`;
  });
  // 原始折线 + 点
  out += `<polyline points="${pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="1.1" opacity=".42"/>`;
  // 5 枚移动平均平滑线
  const half = 2, sm = pts.map((p,i)=>{
    let sum=0, c=0;
    for(let j=i-half;j<=i+half;j++) if(j>=0&&j<pts.length){ sum+=pts[j].v; c++; }
    return { i, v:sum/c };
  });
  out += `<polyline points="${sm.map(p=>X(p.i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    out += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${s.color}" opacity=".85"><title>【${esc(p.g)}-${esc(p.n)}】 大货 ${money2(p.v)}</title></circle>`;
  });
  out += '</svg>';

  return `<div class="card m-hide"><h3>大货金额趋势</h3>
    <div class="desc">${pts.length} 个章子各一个点，纵轴 = 该章子的大货金额（不含均摊）；细线为原始值，粗线为 5 枚移动平均走势；浅色带 = 同一车。横轴按表格车序，越靠前开得越早${excluded?`（已剔除小物/特典 ${excluded} 项）`:''}</div>
    <div class="chart-scroll chart-wide">${out}</div></div>`;
}

  const units = s.groups.flatMap(g=>g.items).filter(it=>it.unitN>0).map(it=>it.unitN).sort((a,b)=>a-b);

  const tblCard = `

    <div class="tbl-wrap"><table>
      <colgroup><col class="c-g"><col class="c-n"><col class="c-qty"><col class="c-num"><col class="c-num"><col class="c-num"></colgroup>
      <thead><tr>
        <th class="pl c-g">车名</th><th class="pl c-n">内容</th><th class="c-qty">数量</th><th class="c-num">均摊</th><th class="c-num">大货</th><th class="c-num">单件</th>
      </tr></thead>
      <tbody>${itemRows}</tbody>
    </table></div></div>`;

  // 图墙
  const figs = [];
  s.groups.forEach(g=>(g.thumbs||[]).forEach(t=>{
    figs.push(`<figure onclick="showImg('${t}','${esc(g.name)}')">
      <img src="${t}" loading="lazy" alt="${esc(g.name)}"><figcaption>${esc(g.name)}</figcaption></figure>`);
  }));
  const galCard = figs.length ? `
    <div class="card"><h3>实物宣图</h3>
    <div class="desc">${figs.length} 张 · 点击放大</div>
    <div class="gal">${figs.join('')}</div></div>` : '';

  $('#serBody').innerHTML = kpis + unitCard + trendCard + tblCard + galCard;

/* =========================================================
   面板 3：系列对比
========================================================= */
const cmp = { k:'total', dir:-1 };
const CMP_COLS = [
  {k:'name',  t:'系列',   pl:true, cls:'c-sr'},
  {k:'groups',t:'车数',   cls:'c-cnt'},
  {k:'badges',t:'枚数',   cls:'c-cnt'},
  {k:'total', t:'总投入', cls:'c-num'},
  {k:'avg',   t:'均单价', cls:'c-num'},
  {k:'max',   t:'最贵单件', cls:'c-num c-hide-m'},
  {k:'min',   t:'最省单件', cls:'c-num c-hide-m'},
];

function seriesRows(){
  return SERIES.map(s=>{
    const badges = s.groups.reduce((a,g)=>a+g.badgeCount,0);
    const units = s.groups.flatMap(g=>g.items).filter(it=>it.unitN>0).map(it=>it.unitN);
    return {
      name:s.name, color:s.color, groups:s.groups.length, badges,
      total:s.total, avg:+(s.total/badges).toFixed(2),
      max:Math.max(...units), min:Math.min(...units),
      share:s.groups.reduce((a,g)=>a+g.items.reduce((x,it)=>x+(NUM(it.share)||0)*it.qtyN,0),0),
      bulk:s.groups.reduce((a,g)=>a+g.items.reduce((x,it)=>x+(NUM(it.bulk)||0)*it.qtyN,0),0),
    };
  });
}

function renderCompare(){
  const rows = seriesRows();
  const totalBar = `
    <div class="card"><h3>总投入排行</h3>
    <div class="desc">10 大系列合计 ${money2(S.grand)}</div>
    ${hbarSVG([...rows].sort((a,b)=>b.total-a.total).map(r=>({label:r.name, value:r.total, color:r.color})), {rowH:30})}</div>`;
  const avgBar = `
    <div class="card"><h3>均单价排行</h3>
    <div class="desc">全系列均单价 ${money2(S.avg)}</div>
    ${hbarSVG([...rows].sort((a,b)=>b.avg-a.avg).map(r=>({label:r.name, value:r.avg, color:r.color})), {rowH:30})}</div>`;

  // 构成对比：均摊 / 大货 占比堆叠条
  const W=680, padL=76, padR=76, rowH=30, padT=8;
  const H = padT + rows.length*rowH + 4;
  let stk = `<svg viewBox="0 0 ${W} ${H}">`;
  [...rows].sort((a,b)=>b.total-a.total).forEach((r,i)=>{
    const y = padT+i*rowH, w = W-padL-padR;
    const sh = w * r.share/r.total, bk = w * r.bulk/r.total;
    stk += `<text x="${padL-10}" y="${y+rowH/2+4.5}" text-anchor="end" font-size="12.8" fill="#3D3230">${esc(r.name)}</text>`;
    stk += `<rect x="${padL}" y="${y+6}" width="${sh}" height="${rowH-12}" rx="4.5" fill="#E88BA6" opacity=".9"/>`;
    stk += `<rect x="${padL+sh}" y="${y+6}" width="${Math.max(0,bk)}" height="${rowH-12}" rx="0" fill="#4FB3B8" opacity=".9"/>`;

    <b>${money2(r.v)}</b></li>`;
  const ovList = (arr, dir) => arr.length
    ? [...arr].sort((a,b)=>dir*(b.v-a.v)).slice(0,10).map(topLi).join('')

  const ovTopHTML = ()=>{
    const L = ovCat==='all' ? allItems : allItems.filter(r=>r.cat===ovCat);

    return `<div class="ov-cats">${chips}</div>

  $('#ovBody').innerHTML = kpis +

/* =========================================================
   面板 5：我在妮妮家吃了多少（勾选 → 汇总）
   金额随时可见，无需"结算揭晓"
========================================================= */
const MINE_KEY = 'nini-mine-v1';
const mine = { sel:{}, qty:{}, rev:{}, all:false, detail:false };

function mineLoad(){
  try{
    const o = JSON.parse(localStorage.getItem(MINE_KEY) || '{}');
    if (o && typeof o === 'object'){ mine.sel = o.sel || {}; mine.qty = o.qty || {}; }
  }catch(e){}
}
function mineSave(){
  try{ localStorage.setItem(MINE_KEY, JSON.stringify({sel:mine.sel, qty:mine.qty})); }catch(e){}
}
const ik = (si,gi,ii) => si+'-'+gi+'-'+ii;
const itemByKey = k => { const [si,gi,ii] = k.split('-').map(Number); return SERIES[si].groups[gi].items[ii]; };
const iDef = it => (it.qtyN>1 ? it.qtyN : 1);
const iQty = (k,it) => (mine.qty[k]!=null ? mine.qty[k] : iDef(it));
/* 勾选一行时算有效数量：存过 0（旧版滚轮 bug 的遗留）就恢复默认 1（小物 9） */
const iQtyOn = (k,it) => { const v = mine.qty[k]!=null ? qwClamp(+mine.qty[k]) : iDef(it); return v>0 ? v : iDef(it); };
const iRev = si => mine.all || !!mine.rev[si];

/* ---------- 数量滚轮 0–10 ----------
   结构：容器高 34px（内容区 32px），每项 22px，首尾各留 5px，
   于是第 v 项居中时 scrollTop = v × 22，用这个反推当前值。 */
const QMAX = 10, QH = 22;
const qwClamp = v => Math.max(0, Math.min(QMAX, v|0));
function qwHTML(k, v, on, tip){
  let s = '<div class="qw-p"></div>';
  for (let i=0;i<=QMAX;i++) s += `<div class="qw-i">${i}</div>`;
  s += '<div class="qw-p"></div>';
  return `<div class="qw${on?'':' off'}" data-qi="${k}" data-v="${v}" tabindex="0"
    role="slider" aria-valuemin="0" aria-valuemax="${QMAX}" aria-valuenow="${v}"
    aria-label="数量"${tip?` title="${tip}"`:''}>${s}</div>`;
}
function qwPaint(el, v){
  const ns = el.querySelectorAll('.qw-i');
  for (let i=0;i<ns.length;i++) ns[i].classList.toggle('sel', i===v);
}
/* 把滚轮滚到 v 并同步数据；silent=true 时不写 localStorage（用于渲染后的初始化） */
function qwSet(el, v, silent){
  v = qwClamp(v);
  el.dataset.v = v;
  el.setAttribute('aria-valuenow', v);
  el.scrollTop = v * QH;
  qwPaint(el, v);
  if (!silent){ mine.qty[el.dataset.qi] = v; mineSave(); updateMine(); }
}
const qwTimers = new WeakMap();
function qwSettle(el){                     /* 滚动停下后再取值，避免中途狂写 */
  clearTimeout(qwTimers.get(el));
  qwTimers.set(el, setTimeout(()=>{
    const v = qwClamp(Math.round(el.scrollTop / QH));
    el.scrollTop = v * QH;                /* 吸附对齐（会再触发一次 scroll，但值没变） */
    if (+el.dataset.v !== v) qwSet(el, v);
  }, 90));
}
function qwInitAll(root){                 /* 渲染后把每个滚轮定位到当前值 */
  (root||document).querySelectorAll('.qw').forEach(el=>{
    const v = qwClamp(+el.dataset.v);
    el.scrollTop = v * QH;
    qwPaint(el, v);
  });
}

/* 手机端（≤760px）：数量滚轮换成原生 <select>，轻量且不卡 */
function mineIsMobile(){
  try{ return window.matchMedia('(max-width:760px)').matches; }catch(e){ return false; }
}
function qselHTML(k, v, on, tip){
  let opts = '';
  for (let i=0;i<=QMAX;i++) opts += `<option value="${i}"${i===v?' selected':''}>${i}</option>`;
  return `<select class="qsel" data-qi="${k}"${on?'':' disabled'} aria-label="数量"${tip?` title="${tip}"`:''}>${opts}</select>`;
}
function qtyCellHTML(k, v, on, tip){
  return mineIsMobile() ? qselHTML(k, v, on, tip) : qwHTML(k, v, on, tip);
}
/* 断点跨越（如旋转屏幕）时重渲染结算页，保证控件形态与屏幕匹配 */
let mineMobileMode = null, mineRqBound = false;
try{
  const rq = window.matchMedia('(max-width:760px)');
  const onMq = ()=>{ if (panelReady.mine && mineMobileMode !== null && mineMobileMode !== mineIsMobile()) renderMine(); };
  if (rq.addEventListener && !mineRqBound){ rq.addEventListener('change', onMq); mineRqBound = true; }
}catch(e){}

/* si 为 null 时统计全部 */
function mineCalc(si){
  let cars=0, badges=0, amount=0;
  SERIES.forEach((s,i)=>{
    if (si!==null && i!==si) return;
    s.groups.forEach((g,gi)=>{
      let hit=false;
      g.items.forEach((it,ii)=>{
        const k = ik(i,gi,ii);
        if (!mine.sel[k]) return;
        const q = iQty(k,it);
        if (!(q>0)) return;
        hit = true; badges += q; amount += it.unitN*q;
      });
      if (hit) cars++;
    });
  });
  return {cars, badges, amount:Math.round(amount*100)/100};
}

function renderMine(){

      <li>勾你买过的章子，数量在 0–10 里选：电脑上滚轮、按住拖或方向键都行（滚一格 ±1）；手机上点数字弹出选择。人鱼「浮雕小物」按「套」计，勾一下默认 9 个。</li>
      <li>顶部「已选金额」实时显示当前勾选的总价（单件 × 数量），随时可看，无需结算。</li>
      <li>每个系列末尾可单独结算，只看这一个系列花了多少；底部「查看汇总」出全部明细。</li>
      <li>顶部系列索引可一键跳到对应系列；点「详细列表」把已勾选的章子汇总成一张大表（每行小计、底部合计）。</li>
      <li>勾选存在这台设备的浏览器里，刷新不丢；换手机或换浏览器各算各的。</li>
    </ul></div>`;

  SERIES.forEach((s,si)=>{
    /* 该系列实际出现过的属性（没有小物的系列就不显示「全选小物」） */
    const cats = ['衣橱','小物'].filter(c=>
      s.groups.some(g=>g.items.some(it=>(it.cat||'衣橱')===c)));
    const rows = s.groups.map((g,gi)=>g.items.map((it,ii)=>{
      const k = ik(si,gi,ii), on = !!mine.sel[k], q = iQty(k,it), rev = iRev(si);
      const w = rowWarn(it) ? ' ⚠' : '';
      /* 属性（衣橱/小物，来自表格「属性」列）与「特典」各自独立，两者都可能是 */
      /* 属性（衣橱/小物，来自表格「属性」列）与「特典」各自独立。
         结算板块按需求取消特典标识；小物标识改用柔和小标，手机端进一步缩小避免突兀 */
      const tag = ((it.cat||'衣橱')==='小物' ? '<span class="cat-tag x">小物</span> ' : '');
      const qt = it.qtyN>1 ? `${esc(String(it.qty))}（1 套 = ${it.qtyN} 个）` : '';
      const m = v => rev ? v : v;   /* 金额随时可见，不遮罩 */
      return `<tr class="${on?'on':''}" data-k="${k}">
        <td class="c-ck"><input type="checkbox" data-ck="${k}" ${on?'checked':''} aria-label="选择"></td>
        <td class="pl c-g">${esc(g.name)}</td>
        <td class="pl c-n">${tag}${esc(it.content)}</td>
        <td class="c-qty">${qtyCellHTML(k, q, on, qt)}</td>
        <td class="c-num">${m(esc(it.share))}</td>
        <td class="c-num">${m(esc(it.bulk))}</td>
        <td class="c-num"><b>${m(esc(it.unit)+w)}</b></td>
      </tr>`;
    }).join('')).join('');

    html += `<div class="card" data-si="${si}">
      <h3><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</h3>
      <div class="desc">${s.groups.length} 车 · 共 <span class="mTotB">—</span> 枚 · 已选 <span class="mSel">0 车 / 0 枚</span></div>
      <div class="mine-acts">
        <button class="btn" data-act="all" data-si="${si}">全选本系列</button>
        ${cats.map(c=>`<button class="btn" data-act="cat" data-cat="${c}" data-si="${si}">全选${c}</button>`).join('')}
        <button class="btn" data-act="none" data-si="${si}">清空</button>
      </div>
      <div class="tbl-wrap"><table class="tm">
        <colgroup><col class="c-ck"><col class="c-g"><col class="c-n"><col class="c-qty"><col class="c-num"><col class="c-num"><col class="c-num"></colgroup>
        <thead><tr>
          <th class="c-ck"></th><th class="pl c-g">衣橱</th><th class="pl c-n">内容</th><th class="c-qty">数量</th>
          <th class="c-num">均摊</th><th class="c-num">大货</th><th class="c-num">单件</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="mine-acts" style="margin:14px 0 0">
        <button class="btn primary" data-act="calc" data-si="${si}">结算本系列</button>
        <button class="btn" data-act="hide" data-si="${si}" style="display:none">隐藏本系列金额</button>
      </div>
      <div class="mine-res" id="mRes${si}"></div>
    </div>`;
  });

  html += `<div id="mineTotal"></div>` + `<div id="mineDetail"></div>`;
  mineMobileMode = mineIsMobile();
  $('#mineBody').innerHTML = html;
  if (!mineBound) bindMine();              /* 监听器只绑一次：重复绑定会让点击越来越卡 */
  bindMineBar();
  qwInitAll($('#mineBody'));
  updateMine();
}

function updateMine(){
  const all = mineCalc(null);
  const c = $('#mCars'), b = $('#mBadges'), a = $('#mAmt');
  if (c) c.textContent = all.cars;
  if (b) b.textContent = all.badges;
  if (a) a.textContent = money2(all.amount);

  SERIES.forEach((s,i)=>{
    const card = $('#mineBody').querySelector('.card[data-si="'+i+'"]');
    if (!card) return;
    const r = mineCalc(i);
    card.querySelector('.mTotB').textContent = s.groups.reduce((a,g)=>a+g.badgeCount,0);
    card.querySelector('.mSel').textContent = r.cars+' 车 / '+r.badges+' 枚';
    const res = card.querySelector('.mine-res');
    const btnCalc = card.querySelector('[data-act="calc"]');
    const btnHide = card.querySelector('[data-act="hide"]');
    if (iRev(i)){
      res.innerHTML = `<div class="mine-sum"><span>已选 <b>${r.cars}</b> 车</span><span><b>${r.badges}</b> 枚</span><span class="big">${money2(r.amount)}</span></div>`;
      btnHide.style.display = '';
      btnCalc.style.display = 'none';
    } else {
      res.innerHTML = '';
      btnHide.style.display = 'none';
      btnCalc.style.display = '';
    }
  });

  const t = $('#mineTotal'), btn = $('#mAll');
  if (mine.all){
    const rows = SERIES.map((s,i)=>({name:s.name, color:s.color, r:mineCalc(i)})).filter(x=>x.r.cars>0);
    t.innerHTML = `<div class="mine-total">
      <h3>我在妮妮家吃了多少</h3>
      <div style="color:var(--ink3);font-size:12.5px">共勾了 ${all.cars} 车 / ${all.badges} 枚</div>
      <div class="rows">${rows.map(x=>`<div>
        <span class="dot" style="background:${x.color}"></span>
        <span>${esc(x.name)}</span>
        <span>${x.r.cars} 车 / ${x.r.badges} 枚</span>
        <span>${money2(x.r.amount)}</span></div>`).join('') || '<div>还没勾选任何章子</div>'}</div>
      <div class="grand"><span class="n">总计</span><span class="v">${money2(all.amount)}</span></div>
    </div>`;
    btn.textContent = '收起汇总'; btn.classList.add('done');
  } else {
    t.innerHTML = '';
    btn.textContent = '查看汇总'; btn.classList.remove('done');
  }

  const det = $('#mineDetail'), btnD = $('#mDetail');
  if (det){
    if (mine.detail){
      let gB=0, gA=0, rows=[];
      SERIES.forEach((s,si)=>{
        let sB=0, sA=0, has=false;
        s.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{
          const k=ik(si,gi,ii); if(!mine.sel[k]) return; const q=iQty(k,it); if(!(q>0)) return;
          has=true; const amt=Math.round(it.unitN*q*100)/100; sB+=q; sA+=amt; gB+=q; gA+=amt;
          const catTag=(it.cat||'衣橱')==='小物'?'<span class="cat-tag x">小物</span>':'<span class="cat-tag">衣橱</span>';
          rows.push(`<tr><td class="pl c-sr">${esc(s.name)}</td><td class="pl c-g">${esc(g.name)}</td><td class="pl c-n">${esc(it.content)}</td><td class="c-cat">${catTag}</td><td class="c-qty">${q}</td><td class="c-num"><b>${esc(it.unit)}</b></td><td class="c-num"><b>${money2(amt)}</b></td></tr>`);
        }));
        if(has) rows.push(`<tr class="dt-sub"><td colspan="3">${esc(s.name)} 小计</td><td></td><td class="c-qty">${sB}</td><td></td><td class="c-num"><b>${money2(sA)}</b></td></tr>`);
      });
      det.innerHTML = gB ? `<div class="mine-detail">
        <h3>已勾选章子明细</h3>
        <div class="desc">共 ${gB} 枚 · 合计 ${money2(gA)}</div>
        <div class="tbl-wrap"><table class="tm tm-detail">
          <colgroup><col class="c-sr"><col class="c-g"><col class="c-n"><col class="c-cat"><col class="c-qty"><col class="c-num"><col class="c-num"></colgroup>
          <thead><tr><th class="pl c-sr">系列</th><th class="pl c-g">车名</th><th class="pl c-n">内容</th><th class="c-cat">属性</th><th class="c-qty">数量</th><th class="c-num">单件</th><th class="c-num">小计</th></tr></thead>
          <tbody>${rows.join('')}</tbody>
          <tfoot><tr><td colspan="3">合计</td><td></td><td class="c-qty">${gB}</td><td></td><td class="c-num"><b>${money2(gA)}</b></td></tr></tfoot>
        </table></div></div>`
        : `<div class="mine-detail"><h3>已勾选章子明细</h3><div class="desc">还没勾选任何章子</div></div>`;
      if(btnD){ btnD.textContent='收起明细'; btnD.classList.add('done'); }
    } else {
      det.innerHTML='';
      if(btnD){ btnD.textContent='详细列表'; btnD.classList.remove('done'); }
    }
  }
}

let mineBound = false;
function bindMine(){
  if (mineBound) return;
  mineBound = true;
  const body = $('#mineBody');

  /* 勾选 / 手机端 select 改数量：都走就地更新，不整页重渲染 */
  body.addEventListener('change', e=>{
    const t = e.target;
    if (t.dataset.ck !== undefined){
      const k = t.dataset.ck;
      mine.sel[k] = t.checked ? 1 : 0;
      const tr = t.closest('tr');
      if (tr){
        tr.classList.toggle('on', t.checked);
        const it = itemByKey(k);
        const v = t.checked ? iQtyOn(k, it) : (mine.qty[k]!=null ? qwClamp(+mine.qty[k]) : iDef(it));
        if (t.checked) mine.qty[k] = v;      /* 勾选即落默认值，杜绝 0 */
        const qw = tr.querySelector('.qw');
        if (qw){ qw.classList.toggle('off', !t.checked); qwSet(qw, v, true); }
        const sl = tr.querySelector('.qsel');
        if (sl){ sl.disabled = !t.checked; sl.value = String(v); }
      }
      mineSave(); updateMine();
    } else if (t.classList && t.classList.contains('qsel')){
      mine.qty[t.dataset.qi] = qwClamp(+t.value);
      mineSave(); updateMine();
    }
  });

  /* 滚轮：scroll 不冒泡，必须用捕获 */
  body.addEventListener('scroll', e=>{
    const el = e.target.closest ? e.target.closest('.qw') : null;
    if (el && !el.classList.contains('off')) qwSettle(el);
  }, true);

  /* 鼠标滚轮：一格只 ±1，不再随浏览器默认步长跳跃（1→3→5 的修复） */
  body.addEventListener('wheel', e=>{
    const el = e.target.closest ? e.target.closest('.qw') : null;
    if (!el || el.classList.contains('off')) return;
    e.preventDefault();
    qwSet(el, qwClamp(+el.dataset.v) + (e.deltaY > 0 ? -1 : 1));
  }, { passive:false, capture:true });

  /* 电脑端按住上下拖（触屏走原生滚动，不接管） */
  body.addEventListener('pointerdown', e=>{
    if (e.pointerType === 'touch' || e.button !== 0) return;
    const el = e.target.closest('.qw');
    if (!el || el.classList.contains('off')) return;
    el.focus({preventScroll:true});
    const y0 = e.clientY, top0 = el.scrollTop;
    const move = ev => { el.scrollTop = top0 - (ev.clientY - y0); };
    const up = ()=>{ document.removeEventListener('pointermove', move);
                     document.removeEventListener('pointerup', up); };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });

  /* 键盘：↑↓ 加减，Home/End 到两端 */
  body.addEventListener('keydown', e=>{
    const el = e.target.closest ? e.target.closest('.qw') : null;
    if (!el || el.classList.contains('off')) return;
    const v = qwClamp(+el.dataset.v);
    let nv = null;
    if (e.key === 'ArrowUp')        nv = v + 1;
    else if (e.key === 'ArrowDown') nv = v - 1;
    else if (e.key === 'Home')      nv = 0;
    else if (e.key === 'End')       nv = QMAX;
    if (nv === null) return;
    e.preventDefault();
    qwSet(el, nv);
  });

  /* 把一张系列卡片里的行统一设为勾/不勾（就地更新，不重渲染）
     cat 有值时只处理该属性（衣橱 / 小物）的行 */
  function setCard(si, on, cat){
    const card = body.querySelector('.card[data-si="'+si+'"]');
    if (!card) return;
    card.querySelectorAll('tbody tr').forEach(tr=>{
      const cb = tr.querySelector('input[type=checkbox]');
      if (!cb) return;
      const k = cb.dataset.ck;
      if (cat && (itemByKey(k).cat||'衣橱') !== cat) return;
      mine.sel[k] = on ? 1 : 0;
      cb.checked = on;
      tr.classList.toggle('on', on);
      const it = itemByKey(k);
      const v = on ? iQtyOn(k, it) : (mine.qty[k]!=null ? qwClamp(+mine.qty[k]) : iDef(it));
      if (on) mine.qty[k] = v;               /* 全选也把数量落到默认值 */
      const qw = tr.querySelector('.qw');
      if (qw){ qw.classList.toggle('off', !on); qwSet(qw, v, true); }
      const sl = tr.querySelector('.qsel');
      if (sl){ sl.disabled = !on; sl.value = String(v); }
    });
    mineSave(); updateMine();
  }

  body.addEventListener('click', e=>{
    const chip = e.target.closest('.mi-chip');
    if (chip){
      const si = +chip.dataset.jump;
      const card = body.querySelector('.card[data-si="'+si+'"]');
      if (card) card.scrollIntoView({behavior:'smooth', block:'start'});
      return;
    }
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'all' || act === 'none'){
      setCard(+btn.dataset.si, act === 'all');
    } else if (act === 'cat'){
      setCard(+btn.dataset.si, true, btn.dataset.cat);
    } else if (act === 'calc'){
      mine.rev[+btn.dataset.si] = true; updateMine();
    } else if (act === 'hide'){
      delete mine.rev[+btn.dataset.si]; updateMine();
    }
  });
}

/* 顶栏「清空全部 / 查看汇总」：这两个按钮随 innerHTML 重建，每次渲染后都要重绑 */
function bindMineBar(){
  $('#mClear').onclick = ()=>{
    mine.sel = {}; mine.qty = {}; mine.rev = {}; mine.all = false;
    const body = $('#mineBody');
    body.querySelectorAll('tbody tr').forEach(tr=>{
      const cb = tr.querySelector('input[type=checkbox]');
      if (cb) cb.checked = false;
      tr.classList.remove('on');
      const qw = tr.querySelector('.qw');
      if (qw) qw.classList.add('off');
      const sl = tr.querySelector('.qsel');
      if (sl) sl.disabled = true;
    });
    mineSave(); updateMine();
    window.scrollTo({top:0,behavior:'smooth'});
  };
  $('#mAll').onclick = ()=>{
    mine.all = !mine.all;
    updateMine();
    if (mine.all) setTimeout(()=>{
      const el = $('#mineTotal');
      if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
    }, 60);
  };
  $('#mDetail').onclick = ()=>{
    mine.detail = !mine.detail;
    updateMine();
    if (mine.detail) setTimeout(()=>{
      const el = $('#mineDetail');
      if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
    }, 60);
  };
}

/* ---------- init（懒渲染：首屏只有明细总表，其余面板点开时再渲染） ---------- */
renderDetail();
</script>
